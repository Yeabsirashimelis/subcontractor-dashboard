databases:
  - name: subcontractor-db
    plan: free
    databaseName: subcontractor_dashboard

services:
  - type: web
    name: subcontractor-dashboard
    plan: free
    runtime: docker
    dockerfilePath: ./dashboard/Dockerfile
    dockerContext: ./dashboard
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: subcontractor-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://subcontractor-dashboard.onrender.com
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
